name: build-apk

on:
  push:
    branches: [ai-fitur]
    paths: [apk-trigger.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK: /opt/android-sdk/ndk/30.0.16248370
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl unzip xz-utils bzip2 python3 build-essential clang lld ninja-build openjdk-21-jdk-headless
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install the Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
      - name: Prepare the source
        run: |
          rm -rf third_party/whisper.cpp/models third_party/whisper.cpp/examples third_party/whisper.cpp/bindings third_party/ncnn/examples third_party/ncnn/benchmark third_party/ncnn/python third_party/ncnn/images
          echo 'org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64' >> gradle.properties
      - name: Build compat32 debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          {
            tools/build_skia.sh compat32
            third_party/FFamp/third_party/build_android.sh build/ffamp-android
            ./gradlew :app:assembleCompat32Debug --no-daemon --console=plain
          } 2>&1 | tee /tmp/apk.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success'
        with:
          name: compat32-debug-apk
          path: android/build/outputs/apk/compat32/debug/*.apk
      - name: Push log to ci-logs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.build.outcome }}
        run: |
          set -e
          touch /tmp/apk.log
          mkdir -p /tmp/logs
          cd /tmp/logs
          git init -q
          git config user.name "build-apk"
          git config user.email "build-apk@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-logs; then
            git checkout -q -B ci-logs FETCH_HEAD
          else
            git checkout -q --orphan ci-logs
          fi
          {
            echo "hasil: ${RESULT}"
            echo "commit: ${GITHUB_SHA}"
            echo "waktu: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            grep -E '^(e|w): |error:|CMake Error|FAILED|What went wrong|BUILD (SUCCESSFUL|FAILED)' -A3 /tmp/apk.log | tail -n 120 || true
          } > apk-ringkasan.txt
          tail -n 1500 /tmp/apk.log > apk-log-penuh.txt
          git add apk-ringkasan.txt apk-log-penuh.txt
          git commit -q -m "log build-apk ${GITHUB_SHA::7} (${RESULT})"
          for i in 1 2 3; do
            git push -q origin HEAD:ci-logs && break
            git fetch -q origin ci-logs
            git rebase -q FETCH_HEAD
          done
      - name: Tandai gagal jika build gagal
        if: steps.build.outcome == 'failure'
        run: exit 1
